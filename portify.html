<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A small browser prototype for composing a portfolio introduction.">
  <title>Portfolio Interface Prototype</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <p class="eyebrow">Portfolio interface prototype</p>
    <h1>Portfolio builder</h1>
    <p class="intro">Enter a few details to preview a simple portfolio introduction.</p>
    <form id="portfolio-form">
      <label for="name">Name</label>
      <input id="name" maxlength="80" required>
      <label for="title">Focus</label>
      <input id="title" maxlength="100" placeholder="e.g. Frontend developer" required>
      <label for="bio">Short bio</label>
      <textarea id="bio" maxlength="500" rows="4" required></textarea>
      <label for="github">GitHub profile URL</label>
      <input id="github" type="url" placeholder="https://github.com/example">
      <label for="linkedin">LinkedIn profile URL</label>
      <input id="linkedin" type="url" placeholder="https://www.linkedin.com/in/example">
      <button type="submit">Generate preview</button>
    </form>
    <section id="preview" class="preview" aria-live="polite">
      <p class="muted">Your preview will appear here.</p>
    </section>
  </main>
</body>
</html>
